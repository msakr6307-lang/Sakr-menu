name: Build MUSTAFA VIP Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        sudo ln -s $HOME/theos/bin/nic.pl /usr/local/bin/nic.pl
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
    
    - name: Install SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks
    
    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make package
    
    - name: Upload dylib and deb
      uses: actions/upload-artifact@v4
      with:
        name: MUSTAFA_VIP_Build
        path: |
          packages/*.deb
          .theos/obj/debug/*.dylib
